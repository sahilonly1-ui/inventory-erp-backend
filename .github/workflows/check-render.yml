name: Check Render Status

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Get Render services and commit result
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          SERVICES=$(curl -s \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services?limit=20")
          
          # Write to a file in the repo
          echo "$SERVICES" > render-status.json
          
          # Also write human-readable summary
          echo "$SERVICES" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          items = d if isinstance(d, list) else []
          print('SERVICES FOUND:', len(items))
          for item in items:
              s = item.get('service', {})
              sd = s.get('serviceDetails', {})
              print('---')
              print('Name:', s.get('name'))
              print('ID:', s.get('id'))
              print('Type:', s.get('type'))
              print('URL:', sd.get('url', 'none'))
              print('Suspended:', s.get('suspended'))
          " > render-summary.txt
          
          cat render-summary.txt
      
      - name: Commit render status to repo
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add render-status.json render-summary.txt
          git diff --staged --quiet || git commit -m "ci: render service status snapshot"
          git push
