name: Price scraper

# Reads live prices + bank offers and posts them to the ERP (Market Prices).
# Backup for the showroom-PC scraper: started from the ERP when that PC is
# offline, 5× a day on schedule (IST 9:30, 12:30, 15:30, 18:30, 21:30), or by hand.
on:
  schedule:
    - cron: '0 4,7,10,13,16 * * *'
  workflow_dispatch:
    inputs:
      queued_only:
        description: 'Only products queued from the ERP (1) or everything due (0)'
        default: '0'
      limit:
        description: 'Max products this run'
        default: '300'

concurrency:
  group: price-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scraper
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scraper/package.json
      # No browser download: GitHub's runner already has Google Chrome installed.
      - run: npm install --no-audit --no-fund --prefer-offline
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: node lib.test.mjs
      - name: Scrape
        run: node index.mjs
        env:
          AGENT_KEY: ${{ secrets.PRICE_AGENT_KEY }}
          CHANNEL: chrome
          QUEUED_ONLY: ${{ github.event.inputs.queued_only || '0' }}
          LIMIT: ${{ github.event.inputs.limit || '300' }}
          CONCURRENCY: '6'
      - name: Keep screenshots of pages that failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug
          path: scraper/debug
          if-no-files-found: ignore
          retention-days: 7
