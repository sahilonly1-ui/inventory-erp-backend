name: Price scraper

# Reads live prices + bank offers and posts them to the ERP (Market Prices).
# Runs 5 times a day (IST 9:30, 12:30, 15:30, 18:30, 21:30), when "Check prices"
# is pressed in the ERP (if GITHUB_DISPATCH_TOKEN is set on Render), or by hand:
# Actions tab → Price scraper → Run workflow.
on:
  schedule:
    - cron: '0 4,7,10,13,16 * * *'
  workflow_dispatch:
    inputs:
      queued_only:
        description: 'Only products queued with "Check prices" (1) or everything due (0)'
        default: '0'
      limit:
        description: 'Max products this run'
        default: '100'

concurrency:
  group: price-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node lib.test.mjs
      - name: Scrape
        run: node index.mjs
        env:
          AGENT_KEY: ${{ secrets.PRICE_AGENT_KEY }}
          QUEUED_ONLY: ${{ github.event.inputs.queued_only || '0' }}
          LIMIT: ${{ github.event.inputs.limit || '100' }}
      - name: Keep screenshots of pages that failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug
          path: scraper/debug
          if-no-files-found: ignore
          retention-days: 7
