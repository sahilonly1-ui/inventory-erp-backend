name: Render Status (read-only)

# Manual, read-only look at the backend services on Render: suspension state,
# URL, and how the latest deploys ended. Results appear as notices on the run
# page. Changes nothing.
on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Query Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          H = {'Authorization': 'Bearer ' + os.environ['RENDER_API_KEY'], 'Accept': 'application/json'}
          def get(path):
              try:
                  with urllib.request.urlopen(urllib.request.Request('https://api.render.com/v1' + path, headers=H), timeout=30) as r:
                      return json.loads(r.read())
              except Exception as e:
                  return {'error': str(e)}
          for item in get('/services?limit=20'):
              s = item.get('service', {})
              d = s.get('serviceDetails') or {}
              print('::notice title=Service %s::id=%s url=%s suspended=%s suspenders=%s plan=%s type=%s' % (
                  s.get('name'), s.get('id'), d.get('url'), s.get('suspended'), s.get('suspenders'), d.get('plan'), s.get('type')))
              deps = get('/services/%s/deploys?limit=3' % s.get('id'))
              if isinstance(deps, list):
                  for x in deps:
                      dp = x.get('deploy', x)
                      print('::notice title=Deploy %s::status=%s created=%s finished=%s commit=%s' % (
                          s.get('name'), dp.get('status'), dp.get('createdAt'), dp.get('finishedAt'),
                          ((dp.get('commit') or {}).get('message') or '')[:60].replace('\n', ' ')))
              else:
                  print('::notice title=Deploy %s::%s' % (s.get('name'), deps))
          PY
