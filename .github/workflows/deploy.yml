name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Create or redeploy Render service
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          echo "Checking for existing Render service..."
          SERVICES=$(curl -s \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services?limit=20")
          
          SERVICE_ID=$(echo "$SERVICES" | python3 -c "
          import sys,json
          try:
            for item in json.load(sys.stdin):
              s=item.get('service',{})
              if s.get('name')=='inventory-erp-backend':
                print(s['id']); break
          except: pass
          " 2>/dev/null || echo "")
          
          if [ -n "$SERVICE_ID" ]; then
            echo "Redeploying existing service: $SERVICE_ID"
            RESULT=$(curl -s -X POST \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              "https://api.render.com/v1/services/$SERVICE_ID/deploys" \
              -d '{"clearCache":"do_not_clear"}')
            echo "Deploy triggered: $(echo $RESULT | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get(\"id\",d))')"
          else
            echo "Creating new Render service..."
            OWNER=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" "https://api.render.com/v1/owners?limit=1")
            OWNER_ID=$(echo "$OWNER" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['owner']['id'])")
            echo "Owner: $OWNER_ID"
            
            curl -s -X POST \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              https://api.render.com/v1/services \
              -d "{
                \"type\":\"web_service\",
                \"name\":\"inventory-erp-backend\",
                \"ownerId\":\"$OWNER_ID\",
                \"repo\":\"https://github.com/sahilonly1-ui/inventory-erp-backend\",
                \"branch\":\"main\",
                \"autoDeploy\":\"yes\",
                \"serviceDetails\":{
                  \"env\":\"node\",
                  \"buildCommand\":\"npm install && npm run build\",
                  \"startCommand\":\"npm run start:prod\",
                  \"plan\":\"free\",
                  \"region\":\"oregon\",
                  \"envVars\":[
                    {\"key\":\"NODE_ENV\",\"value\":\"production\"},
                    {\"key\":\"PORT\",\"value\":\"8080\"},
                    {\"key\":\"DATABASE_URL\",\"value\":\"postgresql://postgres:Harbans_1073@db.xukbgkwagjtzxoobcyuk.supabase.co:5432/postgres\"},
                    {\"key\":\"JWT_ACCESS_SECRET\",\"value\":\"erp_access_j8kX2mNpQvRtYw3sLhA5cE7uFz9dGbH4iJ6oK0lM1nP\"},
                    {\"key\":\"JWT_REFRESH_SECRET\",\"value\":\"erp_refresh_K9mX3nQpRvSuYw4tLiA6cF8vGz0eHbI5jK1lN2oP7qR\"},
                    {\"key\":\"JWT_ACCESS_TTL\",\"value\":\"15m\"},
                    {\"key\":\"JWT_REFRESH_TTL_DAYS\",\"value\":\"7\"},
                    {\"key\":\"CORS_ORIGINS\",\"value\":\"https://bespoke-souffle-3c1a0e.netlify.app\"},
                    {\"key\":\"RATE_LIMIT_WINDOW_MS\",\"value\":\"60000\"},
                    {\"key\":\"RATE_LIMIT_MAX\",\"value\":\"200\"},
                    {\"key\":\"AUTH_RATE_LIMIT_MAX\",\"value\":\"20\"},
                    {\"key\":\"BOOTSTRAP_ADMIN_EMAIL\",\"value\":\"harbans22@gmail.com\"},
                    {\"key\":\"BOOTSTRAP_ADMIN_PASSWORD\",\"value\":\"Harbans@1073\"}
                  ]
                }
              }" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          if 'id' in d:
            print('SUCCESS: Service', d['id'], 'created')
            print('URL: https://inventory-erp-backend.onrender.com')
          else:
            print('RESPONSE:', json.dumps(d,indent=2)[:500])
          "
          fi

      - name: Update Netlify env var
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          SITE_ID=$(curl -s \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/sites" \
            | python3 -c "
          import sys,json
          try:
            for s in json.load(sys.stdin):
              if 'bespoke-souffle' in s.get('name','')+s.get('default_domain',''):
                print(s['id']); break
          except: pass
          " 2>/dev/null || echo "")
          
          if [ -n "$SITE_ID" ]; then
            curl -s -X PATCH \
              -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.netlify.com/api/v1/sites/$SITE_ID" \
              -d '{"build_settings":{"env":{"VITE_API_URL":"https://inventory-erp-backend.onrender.com/api/v1"}}}'
            echo "Netlify VITE_API_URL set."
          fi

      - name: Summary
        run: |
          echo ""
          echo "========================================"
          echo "  DEPLOYMENT TRIGGERED"
          echo "========================================"
          echo "  Backend (building on Render):"
          echo "  https://inventory-erp-backend.onrender.com"
          echo ""
          echo "  Frontend (already live):"
          echo "  https://bespoke-souffle-3c1a0e.netlify.app"
          echo ""
          echo "  Login: harbans22@gmail.com / Harbans@1073"
          echo "  (Render build takes 3-5 min)"
          echo "========================================"
