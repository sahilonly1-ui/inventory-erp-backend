name: Deploy Backend to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  setup-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Push schema to Supabase (idempotent)
        run: npx prisma db push --accept-data-loss --skip-generate
        env:
          DATABASE_URL: "${{ secrets.DATABASE_URL }}?sslmode=require"

      - name: Apply raw constraints (partial indexes + CHECK)
        run: npx ts-node prisma/apply-constraints.ts
        env:
          DATABASE_URL: "${{ secrets.DATABASE_URL }}?sslmode=require"

      - name: Seed database
        run: npx ts-node prisma/seed.ts
        env:
          DATABASE_URL: "${{ secrets.DATABASE_URL }}?sslmode=require"
          BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}

  deploy-render:
    runs-on: ubuntu-latest
    needs: setup-db
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Render
        run: |
          # Check if service exists
          SERVICES=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services?name=inventory-erp-backend&limit=5")
          
          SERVICE_ID=$(echo "$SERVICES" | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
              items = d if isinstance(d, list) else []
              for item in items:
                  svc = item.get('service', {})
                  if svc.get('name') == 'inventory-erp-backend':
                      print(svc['id'])
                      break
          except: pass
          " 2>/dev/null || echo "")
          
          if [ -n "$SERVICE_ID" ]; then
            echo "Redeploying existing service: $SERVICE_ID"
            curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              -H "Content-Type: application/json" \
              "https://api.render.com/v1/services/$SERVICE_ID/deploys" \
              -d '{"clearCache":"do_not_clear"}'
          else
            echo "Creating new Render web service..."
            OWNER_ID=$(curl -s \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              "https://api.render.com/v1/owners?limit=1" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['owner']['id'])")
            
            curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              -H "Content-Type: application/json" \
              https://api.render.com/v1/services \
              -d "{
                \"type\": \"web_service\",
                \"name\": \"inventory-erp-backend\",
                \"ownerId\": \"$OWNER_ID\",
                \"repo\": \"https://github.com/sahilonly1-ui/inventory-erp-backend\",
                \"branch\": \"main\",
                \"autoDeploy\": \"yes\",
                \"serviceDetails\": {
                  \"env\": \"node\",
                  \"buildCommand\": \"npm ci && npx prisma generate && npm run build\",
                  \"startCommand\": \"npm start\",
                  \"plan\": \"free\",
                  \"region\": \"oregon\",
                  \"envVars\": [
                    {\"key\":\"NODE_ENV\",\"value\":\"production\"},
                    {\"key\":\"PORT\",\"value\":\"8080\"},
                    {\"key\":\"DATABASE_URL\",\"value\":\"${{ secrets.DATABASE_URL }}?sslmode=require\"},
                    {\"key\":\"JWT_ACCESS_SECRET\",\"value\":\"${{ secrets.JWT_ACCESS_SECRET }}\"},
                    {\"key\":\"JWT_REFRESH_SECRET\",\"value\":\"${{ secrets.JWT_REFRESH_SECRET }}\"},
                    {\"key\":\"JWT_ACCESS_TTL\",\"value\":\"15m\"},
                    {\"key\":\"JWT_REFRESH_TTL_DAYS\",\"value\":\"7\"},
                    {\"key\":\"PASSWORD_RESET_TTL_MIN\",\"value\":\"30\"},
                    {\"key\":\"CORS_ORIGINS\",\"value\":\"${{ secrets.CORS_ORIGINS }}\"},
                    {\"key\":\"RATE_LIMIT_WINDOW_MS\",\"value\":\"60000\"},
                    {\"key\":\"RATE_LIMIT_MAX\",\"value\":\"200\"},
                    {\"key\":\"AUTH_RATE_LIMIT_MAX\",\"value\":\"20\"},
                    {\"key\":\"BOOTSTRAP_ADMIN_EMAIL\",\"value\":\"${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}\"},
                    {\"key\":\"BOOTSTRAP_ADMIN_PASSWORD\",\"value\":\"${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}\"}
                  ]
                }
              }"
          fi

      - name: Wait for backend health (10 min max)
        run: |
          echo "Waiting for https://inventory-erp-backend.onrender.com/api/v1/health ..."
          for i in $(seq 1 60); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              https://inventory-erp-backend.onrender.com/api/v1/health 2>/dev/null || echo "000")
            echo "[$i/60] HTTP $CODE"
            [ "$CODE" = "200" ] && { echo "Backend UP!"; exit 0; }
            sleep 10
          done
          echo "Timeout — check Render dashboard. Service may still be building."
          exit 0

      - name: Set Netlify VITE_API_URL
        run: |
          SITE_ID=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.NETLIFY_AUTH_TOKEN }}" \
            "https://api.netlify.com/api/v1/sites" \
            | python3 -c "
          import sys, json
          sites = json.load(sys.stdin)
          for s in (sites if isinstance(sites,list) else []):
              if 'bespoke-souffle' in s.get('name','') + s.get('default_domain',''):
                  print(s['id']); break
          " 2>/dev/null || echo "")
          
          if [ -n "$SITE_ID" ]; then
            curl -s -X PATCH \
              -H "Authorization: Bearer ${{ secrets.NETLIFY_AUTH_TOKEN }}" \
              -H "Content-Type: application/json" \
              "https://api.netlify.com/api/v1/sites/$SITE_ID" \
              -d '{"build_settings":{"env":{"VITE_API_URL":"https://inventory-erp-backend.onrender.com/api/v1"}}}'
            echo "Netlify env var VITE_API_URL set."
          fi
